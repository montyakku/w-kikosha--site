<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Register — イベント物販向けの簡易レジ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 font-sans">

  <main class="max-w-2xl mx-auto px-6 py-20 text-center">

    <img src="icon.png" alt="Simple Register アイコン" class="w-24 h-24 mx-auto rounded-2xl shadow mb-8">

    <h1 class="text-4xl font-bold mb-3">Simple Register</h1>
    <p class="text-lg text-gray-500 mb-10">イベント物販向けの簡易レジ</p>

    <p class="text-base text-gray-600 leading-relaxed mb-12">
      QR コードでスタッフを招待し、Google Drive でデータを管理。<br>
      サーバー不要で、イベント当日すぐに使える iPhone 向けレジアプリです。
    </p>

    <a href="https://apps.apple.com/jp/app/id" class="inline-block bg-black text-white text-sm font-medium px-6 py-3 rounded-full hover:opacity-80 transition mb-4">
      App Store からダウンロード
    </a>

    <div class="mt-16 text-sm text-gray-400 space-x-4">
      <a href="privacy/" class="hover:text-gray-600">プライバシーポリシー</a>
      <span>·</span>
      <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" class="hover:text-gray-600">利用規約</a>
    </div>

  </main>

  <footer class="text-center text-xs text-gray-300 pb-8">
    © 2026 w-kikosha
  </footer>

</body>
</html>
